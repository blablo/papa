version: "2"
services:

  papa:
    build:
      context: ./
      dockerfile: ./Dockerfile
    container_name: papa
    command: /bin/bash -c "/papa/run.sh"
    restart: always
    ports:
      - "3001:3000"
    environment:
      RAILS_ENV: production
      RACK_ENV: production
      SERVER_NAME: misventasya.com
      #Database
      DB_NAME: papa_production
      DB_USERNAME: root
      DB_PORT: 3306
      DB_POOL: 5

      
